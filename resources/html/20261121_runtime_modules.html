}

  --tbd: #fbbf24; --tbd-bg: #3a2f10; --tag: #34343a;
}
body { margin: 0; background: var(--bg); color: var(--ink);

main { max-width: 1440px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font-size: 20px; margin: 0 0 14px; }
svg { width: 100%; height: auto; display: block; }
svg text { font-size: 13px; }
.tx { fill: var(--ink); }
.tb { fill: var(--ink); font-weight: 600; }
.mt { fill: var(--mute); }
.src { fill: var(--mute); font-family: ui-monospace, Menlo, monospace; }
.h { font-size: 18px !important; font-weight: 700; }
.fcT { fill: var(--forecast); } .dtT { fill: var(--detect); } .rpT { fill: var(--repair); } .lgT { fill: var(--ledger); }
.mod { fill: var(--card); stroke-width: 2; }
.mod.fc { stroke: var(--forecast); } .mod.dt { stroke: var(--detect); } .mod.rp { stroke: var(--repair); }
.ledger { fill: var(--card); stroke: var(--ledger); stroke-width: 1.6; stroke-dasharray: 4 3; }
.sub { fill: var(--sub); stroke: var(--line); stroke-width: 1; }
.trig { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
.tg { fill: var(--tag); }
.cond { fill: var(--card); stroke: var(--line); stroke-width: 1; }
.tl { fill: none; stroke: var(--line); stroke-width: 1.3; }
.ln { fill: none; stroke: var(--mute); stroke-width: 1.6; }
.nt { stroke: var(--forecast); stroke-dasharray: 5 4; }
.ntT { fill: var(--forecast); }
.chip { fill: var(--card); stroke-width: 1.5; }
.chip.extend { stroke: var(--extend); } .chip.raise { stroke: var(--raise); }
.chip.reroute { stroke: var(--reroute); } .chip.borrow { stroke: var(--borrow); }
.chipt { font-weight: 600; }
.chipt.extend { fill: var(--extend); } .chipt.raise { fill: var(--raise); }
.chipt.reroute { fill: var(--reroute); } .chipt.borrow { fill: var(--borrow); }
.tbdb { fill: var(--tbd-bg); } .tbdt { fill: var(--tbd); font-weight: 700; }
</style>
