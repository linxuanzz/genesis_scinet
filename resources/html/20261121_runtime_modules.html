<style>
:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161618; --card: #202023; --ink: #ececef; --mute: #9a9aa2; --line: #4a4a52;
    --fc: #6ea2ff; --dt: #fb8c4c; --rp: #4ade80; --inf: #a1a1aa;
    --ex: #7aa7ff; --in: #5ee08a; --rr: #ff9a5a; --bo: #c084fc; --led: #a1a1aa; --ext: #22d3ee; --br: #fbbf24;
    --fc-bg: #1c2433; --dt-bg: #2e221a; --rp-bg: #1a2a20;
  }
}
:root[data-theme="dark"] {
  --bg: #161618; --card: #202023; --ink: #ececef; --mute: #9a9aa2; --line: #4a4a52;
  --fc: #6ea2ff; --dt: #fb8c4c; --rp: #4ade80; --inf: #a1a1aa;
  --ex: #7aa7ff; --in: #5ee08a; --rr: #ff9a5a; --bo: #c084fc; --led: #a1a1aa; --ext: #22d3ee; --br: #fbbf24;
  --fc-bg: #1c2433; --dt-bg: #2e221a; --rp-bg: #1a2a20;
}
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
main { max-width: 1440px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p.sub { margin: 0 0 12px; color: var(--mute); font-size: 13px; }
svg { width: 100%; height: auto; display: block; }
svg text { font-size: 13px; }
.tx { fill: var(--ink); } .tb { fill: var(--ink); font-weight: 600; } .mt { fill: var(--mute); }
.term { fill: var(--card); stroke: var(--ink); stroke-width: 1.5; }
.evt { fill: var(--card); stroke: var(--line); stroke-width: 1.3; }
.node { stroke-width: 2; }
.node.fc { fill: var(--fc-bg); stroke: var(--fc); } .node.dt { fill: var(--dt-bg); stroke: var(--dt); }
.node.rp { fill: var(--rp-bg); stroke: var(--rp); } .node.inf { fill: var(--card); stroke: var(--inf); }
.nname { font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 14px !important; }
.fcT { fill: var(--fc); } .dtT { fill: var(--dt); } .rpT { fill: var(--rp); } .infT { fill: var(--inf); }
.panel { fill: var(--card); stroke-width: 1.2; }
.panel.fc { stroke: var(--fc); } .panel.dt { stroke: var(--dt); } .panel.rp { stroke: var(--rp); }
.ln { fill: none; stroke: var(--mute); stroke-width: 1.6; }
.by { stroke-dasharray: 5 4; }
.conn { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 2 3; }
.chip { fill: var(--card); stroke-width: 1.4; }
.chipt { font-weight: 600; }
.chip.ex { stroke: var(--ex); } .chipt.ex { fill: var(--ex); }
.chip.in { stroke: var(--in); } .chipt.in { fill: var(--in); }
.chip.rr { stroke: var(--rr); } .chipt.rr { fill: var(--rr); }
.chip.bo { stroke: var(--bo); } .chipt.bo { fill: var(--bo); }
.chip.led { stroke: var(--led); } .chipt.led { fill: var(--led); }
.chip.ext { stroke: var(--ext); } .chipt.ext { fill: var(--ext); }
.chip.br { stroke: var(--br); } .chipt.br { fill: var(--br); }
</style>
</head>
